<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.7)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="#000000" rx="24" />

  <!-- Outer Fine Border -->
  <rect x="20" y="20" width="760" height="760" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" rx="16" />

  <!-- Center Monogram / Crest Graphic -->
  <g transform="translate(400, 290)">
    <!-- Shield / Emblem Contour Outer -->
    <path d="M-130,-140 L130,-140 C130,-140 140,40 0,165 C-140,40 -130,-140 -130,-140 Z"
          fill="none" stroke="url(#silverGrad)" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Inner Shield Inset Line -->
    <path d="M-112,-124 L112,-124 C112,-124 120,30 0,140 C-120,30 -112,-124 -112,-124 Z"
          fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Stylized 'C' and 'M' Precision Wings -->
    <!-- Wing left (C) -->
    <path d="M -80,-85 L -20,-85 L -35,-55 L -65,-55 C -75,-35 -75,0 -50,22 C -30,40 5,42 25,25 L 42,48 C 12,70 -35,68 -68,40 C -98,12 -98,-45 -80,-85 Z"
          fill="url(#silverGrad)" />

    <!-- Wing right (M) -->
    <path d="M 0,-85 L 80,-85 L 80,48 L 54,48 L 54,-45 L 28,10 L 8,10 L 0,-6 Z"
          fill="#ffffff" />
    
    <!-- Central Speed Diamond -->
    <polygon points="0,-105 14,-85 0,-65 -14,-85" fill="url(#silverGrad)" />
  </g>

  <!-- Brand Typography -->
  <!-- CHAHROUR -->
  <text x="400" y="555"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'DM Sans', 'Inter', sans-serif"
        font-size="60"
        font-weight="900"
        letter-spacing="14"
        fill="#ffffff">
    CHAHROUR
  </text>

  <!-- MOTORS Divider Line -->
  <line x1="160" y1="600" x2="310" y2="600" stroke="url(#accentGrad)" stroke-width="2" />
  <text x="400" y="608"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'DM Sans', 'Inter', sans-serif"
        font-size="24"
        font-weight="700"
        letter-spacing="16"
        fill="#cbd5e1">
    MOTORS
  </text>
  <line x1="490" y1="600" x2="640" y2="600" stroke="url(#accentGrad)" stroke-width="2" />

  <!-- Subtitle Location -->
  <text x="400" y="665"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'DM Sans', 'Inter', sans-serif"
        font-size="16"
        font-weight="600"
        letter-spacing="8"
        fill="#94a3b8">
    BAABDA • LEBANON
  </text>

  <!-- Hotline Phone Number -->
  <text x="400" y="718"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'DM Sans', 'Inter', sans-serif"
        font-size="20"
        font-weight="700"
        letter-spacing="5"
        fill="#ffffff">
    +961 71 561 595
  </text>
</svg>
